name: Spack Builds (Ubuntu x86_64 Buildcache)

on: [pull_request]

env:
  SPACK_COLOR: always
  REGISTRY: ghcr.io/llnl
  SPACK_CACHE: /opt/spack-cache
  tempdir: /opt/spack-cache
  TMP: /opt/spack-cache
  TMPDIR: /opt/spack-cache

  # Our repo name contains upper case characters, so we can't use
  # ${{ github.repository }}
  IMAGE_NAME: hiop
  USERNAME: hiop-bot
  BASE_VERSION: ubuntu-24.04-fortran

jobs:
  base_image_build:
    runs-on: ubuntu-24.04

    permissions:
      packages: write
      contents: read

    name: Build Custom Base Image

    steps:
      # No GHCR base image with skopeo, so this will do...
      - name: Set up skopeo
        uses: warjiang/setup-skopeo@v0.1.3
        with:
          version: latest

      # Use skopeo to check for image for convenience
      - name: Check for existing base images
        run: |
          set -e

          CONTAINER_TAG="${{ env.BASE_VERSION }}"
          OCI_URL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BASE_VERSION }}"

          echo "Checking for CONTAINER_TAG ${CONTAINER_TAG}"

          if skopeo inspect \
            "docker://${OCI_URL}" \
            --raw \
            --creds "${{ env.USERNAME }}:${{ secrets.GITHUB_TOKEN }}" \
            > /dev/null 2>&1; then
            echo "Image already exists."
            echo "IMAGE_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "Image does not exist; it will be built."
            echo "IMAGE_EXISTS=false" >> "$GITHUB_ENV"
          fi

      # Need to build custom base image with gfortran
      - name: Create Dockerfile heredoc
        if: ${{ env.IMAGE_EXISTS == 'false' }}
        run: |
          cat << 'EOF' > Dockerfile
          FROM ubuntu:24.04

          RUN apt-get update && \
              apt-get install -y --no-install-recommends \
                software-properties-common \
                gpg-agent \
                openssh-client \
                openssh-server \
              && rm -rf /var/lib/apt/lists/*

          RUN add-apt-repository ppa:ubuntu-toolchain-r/test && \
              apt-get update && \
              apt-get install -y --no-install-recommends \
                gfortran \
                gcc \
                libstdc++6 \
              && rm -rf /var/lib/apt/lists/*
          EOF

      # https://docs.github.com/en/actions/publishing-packages/publishing-docker-images
      - name: Log in to the Container registry
        if: ${{ env.IMAGE_EXISTS == 'false' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: ${{ env.IMAGE_EXISTS == 'false' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: org.opencontainers.image.version=${{ env.BASE_VERSION }}

      - name: Build and push Docker base image
        if: ${{ env.IMAGE_EXISTS == 'false' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BASE_VERSION }}
          labels: ${{ steps.meta.outputs.labels }}

  hiop_spack_builds:
    needs: base_image_build
    runs-on: ubuntu-22.04

    permissions:
      packages: write
      contents: read

    strategy:
      matrix:
        spack_spec:
          - hiop@develop+mpi~raja~shared~kron~sparse ^openmpi
          - hiop@develop~mpi~raja~shared~kron~sparse
          - hiop@develop~mpi+raja~shared~kron~sparse
          # We will need coinhsl for this, but what are the rules for using
          # a coinhsl tarball?
          # - hiop@develop~mpi~raja~shared~kron+sparse

        blas_provider:
          - openblas

        compiler:
          - gcc

    name: Build HiOp with Spack

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Once we move submodule deps into Spack, we can do more builds.
          # Also need to change build script to use Spack from base image.
          submodules: true

      - name: Clone Spack v1.2.2
        run: |
          git clone \
            --branch v1.2.2 \
            --depth 1 \
            https://github.com/spack/spack.git

      - name: Setup Spack
        run: |
          echo "$PWD/spack/bin" >> "$GITHUB_PATH"

      - name: Verify Spack version
        run: |
          VERSION="$(spack --version)"
          echo "Spack version: $VERSION"

          case "$VERSION" in
            1.2.2*) ;;
            *)
              echo "ERROR: Expected Spack 1.2.2"
              exit 1
              ;;
          esac

      - name: Create heredoc spack.yaml
        run: |
          spack debug report

          cat << EOF > spack.yaml
          spack:
            specs:
            - ${{ matrix.spack_spec }} target=x86_64_v2
            - ${{ matrix.blas_provider }} target=x86_64_v2

            concretizer:
              # Reuse existing dependency binaries from Spack / GHCR mirrors.
              # The HiOp root package is explicitly forced to build from source
              # in the install command below.
              reuse: true
              unify: true

            config:
              source_cache: $SPACK_CACHE/source_cache
              misc_cache: $SPACK_CACHE/misc_cache
              build_stage: $SPACK_CACHE/build_stage
              keep_stage: true

              install_tree:
                root: /opt/spack
                padded_length: false

            mirrors:
              local-buildcache: oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
              spack: https://binaries.spack.io/develop

            packages:
              all:
                require: "%${{ matrix.compiler }}"

              # We don't need CMake GUI features for minimal container builds.
              cmake:
                require: "~qtgui~ncurses"

              # Building OpenSSL was causing errors.
              libevent:
                require: "~openssl"
          EOF

      - name: Configure GHCR mirror
        run: |
          spack -e . mirror set \
            --oci-username "${{ env.USERNAME }}" \
            --oci-password "${{ secrets.GITHUB_TOKEN }}" \
            local-buildcache

      - name: Trust keys
        run: |
          yes | spack -e . buildcache keys --install --trust \
            || echo "No keys to trust, continuing..."

      - name: Find external packages
        run: |
          spack -e . external find \
            --all \
            --exclude python \
            --exclude curl \
            --exclude openssl

      - name: Spack develop HiOp
        run: |
          spack -e . develop \
            --path="$(pwd)" \
            hiop@git."${{ github.head_ref || github.ref_name }}"=develop

      - name: Concretize
        run: |
          spack -e . concretize --fresh

      - name: Show concretized environment
        run: |
          spack -e . find -lv

      - name: Install dependencies
        run: |
          spack -e . install \
            --only dependencies \
            --use-buildcache package:never,dependencies:auto \
            --no-check-signature \
            --show-log-on-error \
            --verbose

      - name: Build HiOp from source
        env:
          SPACK_KEEP_BUILD_STAGE: "true"
        run: |
          spack -e . install \
            --only package \
            --use-buildcache package:never,dependencies:auto \
            --keep-stage \
            --no-check-signature \
            --show-log-on-error \
            --verbose

      - name: Test Build
        run: |
          # Load OpenMPI environment for the +mpi matrix entry.
          # Non-MPI entries simply skip this.
          spack -e . load --sh openmpi > env.txt 2>/dev/null \
            || rm -f env.txt

          if [ -f env.txt ]; then
            source env.txt
          fi

          BUILD_DIR="$(spack -e . location --build-dir hiop@develop)"

          echo "HiOp build directory: ${BUILD_DIR}"

          if [ -z "${BUILD_DIR}" ] || [ ! -d "${BUILD_DIR}" ]; then
            echo "ERROR: HiOp build directory does not exist."
            exit 1
          fi

          cd "${BUILD_DIR}"
          ctest --output-on-failure -VV

      - name: Push binaries to buildcache
        if: ${{ !cancelled() }}
        env:
          GITHUB_USER: ${{ env.USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          spack -e . mirror set \
            --oci-username-variable GITHUB_USER \
            --oci-password-variable GITHUB_TOKEN \
            local-buildcache

          spack -e . buildcache push \
            --force \
            --allow-missing \
            --base-image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BASE_VERSION }}" \
            --unsigned \
            --update-index \
            local-buildcache