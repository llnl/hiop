stages:
  - config
  - build
  - test
  - clean

include:
  - project: 'lc-templates/id_tokens'
    file: 'id_tokens.yml'

variables:
  GIT_SUBMODULE_STRATEGY: recursive

.dane: 
  tags:
    - shell
    - dane
  variables:
    CUSTOM_CI_BUILDS_DIR: "/usr/workspace/hiop/gitlab_ci/dane/${CI_PIPELINE_ID}"
    MY_CLUSTER: dane

.lassen: 
  tags:
    - shell
    - lassen
  variables:
    CUSTOM_CI_BUILDS_DIR: "/usr/workspace/hiop/gitlab_ci/lassen/${CI_PIPELINE_ID}"
    MY_CLUSTER: lassen

.llnl_script_config:
  stage: config 
  script:
    - |
      # Don't clean up this working directory - we need these files for
      # testing
      echo "CI_PIPELINE_ID = ${CI_PIPELINE_ID}"
      echo "CI_JOB_ID = ${CI_JOB_ID}"
      echo "CUSTOM_CI_BUILDS_DIR = ${CUSTOM_CI_BUILDS_DIR}"
      set -xv
      mkdir -p "$CUSTOM_CI_BUILDS_DIR"
      cp -R ./* "$CUSTOM_CI_BUILDS_DIR"
      res=$?
      exit $res

.llnl_script_build: 
  stage: build
  script:
    - |
      # Don't clean up this working directory - we need these files for
      # testing
      echo "CI_PIPELINE_ID = ${CI_PIPELINE_ID}"
      echo "CI_JOB_ID = ${CI_JOB_ID}"
      echo "CUSTOM_CI_BUILDS_DIR = ${CUSTOM_CI_BUILDS_DIR}"
      set -xv
      cd "$CUSTOM_CI_BUILDS_DIR"
      ./BUILD.sh --build-only || exit 1

.llnl_script_test: 
  stage: test
  variables:
    GIT_STRATEGY: none
  script:
    - |
      echo "CI_PIPELINE_ID = ${CI_PIPELINE_ID}"
      echo "CI_JOB_ID = ${CI_JOB_ID}"
      echo "CUSTOM_CI_BUILDS_DIR = ${CUSTOM_CI_BUILDS_DIR}"
      set -xv
      cd "$CUSTOM_CI_BUILDS_DIR"
      ./BUILD.sh --test-only
      res=$?
      exit $res

.llnl_script_clean: 
  stage: clean
  variables:
    GIT_STRATEGY: none
  script:
    - |
      echo "CI_PIPELINE_ID = ${CI_PIPELINE_ID}"
      echo "CI_JOB_ID = ${CI_JOB_ID}"
      echo "CUSTOM_CI_BUILDS_DIR = ${CUSTOM_CI_BUILDS_DIR}"
      set -xv
      cd "$CUSTOM_CI_BUILDS_DIR/.."
      sleep 10
      rm -rf "$CUSTOM_CI_BUILDS_DIR"
      #rm -rf "/usr/workspace/hiop/gitlab_ci/scripts/$CI_RUNNER_SHORT_TOKEN"

.llnl_jsrun_script_test: 
  stage: test
  variables:
    GIT_STRATEGY: none
  script:
    - |
      echo "CI_PIPELINE_ID = ${CI_PIPELINE_ID}"
      echo "CI_JOB_ID = ${CI_JOB_ID}"
      echo "CUSTOM_CI_BUILDS_DIR = ${CUSTOM_CI_BUILDS_DIR}"
      set -xv
      cd "$CUSTOM_CI_BUILDS_DIR"
      lalloc 1 -W 35 -q pbatch ./BUILD.sh --test-only
      res=$?
      exit $res

.llnl_build_python: 
  stage: build
  script:
    - |
      # Don't clean up this working directory - we need some of these files for
      # testing
      source /usr/workspace/hiop/dane/venv/envDane.sh
      source /usr/workspace/hiop/dane/venv/hiopbbpy-ci/bin/activate
      echo "CI_PIPELINE_ID = ${CI_PIPELINE_ID}"
      echo "CI_JOB_ID = ${CI_JOB_ID}"
      echo "CUSTOM_CI_BUILDS_DIR = ${CUSTOM_CI_BUILDS_DIR}"
      set -xv
      cd "$CUSTOM_CI_BUILDS_DIR"
      pip install . || exit 1

.llnl_test_hiopbbpy: 
  stage: test
  variables:
    GIT_STRATEGY: none
  script:
    - |
      source /usr/workspace/hiop/dane/venv/envDane.sh
      source /usr/workspace/hiop/dane/venv/hiopbbpy-ci/bin/activate
      echo "CI_PIPELINE_ID = ${CI_PIPELINE_ID}"
      echo "CI_JOB_ID = ${CI_JOB_ID}"
      echo "CUSTOM_CI_BUILDS_DIR = ${CUSTOM_CI_BUILDS_DIR}"
      set -xv
      cd "$CUSTOM_CI_BUILDS_DIR"
      salloc --time=2:00 --nodes=1 --partition=pbatch --reserv=ci --ntasks=1 \
        bash -c 'python src/Drivers/hiopbbpy/BODriverEX.py'
      res=$?
      exit $res

# For LLNL/dane CI
config_on_dane:
  extends:
    - .dane
    - .llnl_script_config

build_on_dane:
  extends:
    - .dane
    - .llnl_script_build
  needs: ['config_on_dane']

test_on_dane:
  extends:
    - .dane
    - .llnl_script_test
  needs: ['build_on_dane_hiopbbpy']

build_on_dane_hiopbbpy:
  extends:
    - .dane
    - .llnl_build_python
  needs: ['build_on_dane']

test_on_dane_hiopbbpy:
  extends:
    - .dane
    - .llnl_test_hiopbbpy
  needs: ['test_on_dane']

clean_on_dane:
  extends:
    - .dane
    - .llnl_script_clean
  needs: ['test_on_dane_hiopbbpy', 'test_on_dane']

